<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>帳號管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 確保在 Tailwind 加載前 body 有個基礎背景色 */
      html, body, #root {
        height: 100%;
      }
      body {
        background-color: #f7fafc; /* 對應 Tailwind 的 gray-100 */
      }

      /* Styles for Flow Capture Mode */
      body.capture-mode-active [data-selectable-id] {
        cursor: pointer;
        position: relative;
      }
      body.capture-mode-active [data-selectable-id]:hover {
        outline: 3px solid #60a5fa; /* blue-400 */
        box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
      }
      body.capture-mode-active [data-selectable-id][data-is-selected="true"] {
        outline: 3px solid #2563eb; /* blue-600 */
      }
      body.capture-mode-active [data-selectable-id][data-is-selected="true"]::before {
        content: attr(data-step-number);
        position: absolute;
        top: -10px;
        left: -10px;
        background-color: #2563eb; /* blue-600 */
        color: white;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        z-index: 10;
        border: 2px solid white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai",
    "mermaid": "https://esm.sh/mermaid@10",
    "react-markdown": "https://esm.sh/react-markdown@9",
    "remark-gfm": "https://esm.sh/remark-gfm@4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
